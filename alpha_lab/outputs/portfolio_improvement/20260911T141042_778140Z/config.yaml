# 固定方案审计，不扫参数；权重只用 TRAIN，组合只验证既有 VALID。
train: ['2014-01-01', '2021-12-31']
valid: ['2022-01-01', '2023-12-31']
horizon: 20
embargo: 5
min_cross_section: 100
output_root: outputs/monthly_portfolio_audit
data_workers: 2
api_interval_seconds: 0.4
api_row_limit: 5800
portfolio:
  capital: 210000.0
  top_n: 50
  band_mult: 1.0
  buy_cost: 0.001
  sell_cost: 0.002
  min_fee: 5.0
  annual_days: 244
  min_listing_calendar_days: 60
  max_volume_participation: 0.01
  stale_warning_days: 20
  cash_dividend_haircut: 0.2  # 固定保守扣减，非真实持有期税务结算
  delist_recovery: 0.0       # 摘牌日减记；不虚构最后成交价变现
  price_tick: 0.01
  action_price_atol: 0.02
  action_price_rtol: 0.002
  adjustment_rtol: 0.00001
  strict_actions: true
  require_official_limits: true
  boards:
    main: {min_buy: 100, buy_step: 100, start: '1990-01-01'}
    chinext: {min_buy: 100, buy_step: 100, start: '2009-10-30'}
    star: {min_buy: 200, buy_step: 1, start: '2019-07-22'}
    beijing: {min_buy: 100, buy_step: 1, start: '2021-11-15'}
