  P3: 新资料、新资产或分钟频率扩展；保持日频月频主线独立
origin_definitions:
  historical: 历史记录中存在此机制，具体可执行边界仍见候选说明
  historical_with_normalization: 历史机制加本次标准化落地建议；不把建议当作原始实现
  current_control: 本轮整理引用的既有经典或零假设对照
