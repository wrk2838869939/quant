  needs_pit_alignment: 已有部分资料；须固定历史映射、覆盖或跨市场时钟后再测
  needs_causal_training: 须实现逐期训练与标签成熟、定向、选参边界；不是读取旧模型即用
  needs_data_extension: 当前固定执行/特征包不足；单独固定扩展资料后再测
  proposal_only: 原始机制尚无充分公式；先预注册定义，不冒充已实现策略
