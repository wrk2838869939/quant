# 实盘准备使用独立账户账本；仅导出计划，不连接或提交券商订单。
strategy: hybrid_full_risk
schedule: {kind: calendar, parameter: 1, anchor: '2022-01-01', interval: 20}
top_n: 5
candidate_pool: 20
max_stock_fraction: 0.25
buy_cost: 0.001
sell_cost: 0.002
min_fee: 5.0
buy_limit_buffer: 0.02
sell_limit_buffer: 0.10
st_sell_limit_buffer: 0.05
max_volume_participation: 0.01
price_tick: 0.01
solver_relative_gap: 0.001
cash_tolerance: 0.02
execution_session: opening_auction
restore: false
lot_grace: false
trend: {medium_window: 60, long_window: 120, min_return: 0.0, require_above_long_ma: true}
hold: {medium_window: 60, long_window: 120, baseline_confirmations: 2, patient_confirmations: 3, persistence_window: 20, persistent_weak_days: 10, variants: {hybrid: {accelerate: broken, patient: true}}}
min_listing_days: 60
risk_windows: {volatility: 20, drawdown: 120}
