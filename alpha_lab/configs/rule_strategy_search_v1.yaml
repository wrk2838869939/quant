  initial_cash_at_first_outer_only: 100000
  unmatured_trade_pnl_may_use_future_exit: false
  formal_unbiased_dates: null
  formal_scope_blocker: 工程93股有全期质量隔离偏差；时间切分不能修复，也不能重新命名为新鲜样本外
selection:
  risk_limit_from_account: true
  inner_require_continuous_mdd_at_most: 0.3
  inner_require_each_block_mdd_at_most: 0.3
  zero_buy_config: retain_in_results_but_not_select_as_stock_strategy
  primary: median_inner_block_net_annualized_return
  tie_band_annualized_return: 0.005
  tie_breakers:
  - numeric_neighborhood_net_return_q25
  - lower_turnover
  - lower_rule_complexity
  neighborhood_score: only_actual_evaluated_neighbors_same_structural_branch; unsampled_not_imputed
  insufficient_neighborhood_evidence: mark_unknown_and_do_not_claim_plateau
  isolated_peak: retain_and_flag_fragile_not_automatically_disprove
  no_feasible_configuration: report_none_do_not_relax_risk_limit
  outer_select_best_after_seeing_results: false
