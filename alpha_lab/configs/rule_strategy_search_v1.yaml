branch_whitelist:
  S07:
    allow:
    - 固定趋势许可
    - 固定连续性/效率/位置评分
    defer:
    - 收益/MAE预测门槛
  S11:
    allow:
    - 预先固定负方向VWAP偏离极值
    - 预先登记表达式及方向
    defer:
    - 按标签IC学习符号
    - 重新挖表达式
  M01:
    allow:
    - 等权
    - 预先给定族等权
    - 固定权重候选作为超参数
    defer:
    - IC/ICIR估计权重
    - 预测模型权重
  S15:
    allow:
    - 当时行业内滚动相关/残差规则
    defer:
    - 训练聚类模型
    - 估计预测关系
  S16:
    allow:
    - 固定低波冷门评分
    - 已有行业映射相关项
    defer:
    - 依赖学习相关性簇的分支
  O01:
    allow:
    - 计数阈值
    - 固定条件过滤
    defer:
    - 训练决策树
  O02:
    allow:
    - 滚动平均
    - 固定系数EWMA
    - 预先固定参数的因果Kalman
    - 排名确认
    defer:
    - 估计滤波噪声参数
    - 学习排名校准
  O03:
    allow:
    - 固定趋势/广度/波动门槛
    defer:
    - 按滚动IC学习选择regime
  O04:
    allow:
    - 收盘确认次时点成交的规则退出
    defer:
    - 需分钟路径的精确盘中止盈止损
  O06:
    allow:
    - 等预算
    - 逆ATR预算
    - 固定集中度上限
    defer:
    - 预测MAE预算
  O07:
    allow:
    - 规则风险减仓的真实成交额度恢复
    defer:
    - 依赖预测风险证据的恢复
  O14:
    allow:
    - 固定波动分组
    - 当时行业域
    defer:
    - 从未来绩效学习研究域
