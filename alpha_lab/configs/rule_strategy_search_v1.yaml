classic_tuning_policy: 另记优化版本，不能覆盖固定B03/B04/B05；同搜索预算与内外层约束
search:
  seed: 20260920
  budget_unit: family_per_outer_fold_including_all_structural_variants
  max_unique_trials: 256
  exhaustive_if_legal_space_at_most: 256
  otherwise:
    global_joint_trials: 128
    local_refinement_trials: 64
    continued_global_trials: 64
    categorical_stratification: true
    sampling: stratified_categorical_then_uniform_numeric_domain_without_replacement_over_legal_complete_configs
  retain_distinct_regions: 4
  local_neighbors:
  - adjacent_numeric_grid_values
  - integer_plus_minus_one_when_legal
  - rounded_plus_minus_ten_percent_when_legal
  - joint_two_coordinate_moves
  - nearby_numeric_domain_points_not_only_coarse_reference_values
  categorical_neighbors: separate_structural_branches_not_numeric_interpolation
  deduplicate_complete_configs: true
  infer_unsampled_scores: false
  stop_on_bad_early_performance: false
  errors_and_illegal_configs_logged_separately: true
  space_exhaustion_or_budget_is_not_global_optimality: true
  legal_space_definition: numeric_domains full stepped range crossed with categorical variants and joint portfolio
    dimensions, after constraints
  reference_points: include_historical_reference_configs_in_global_budget_when_legal_not_only_winners
validation:
  mode: chronological_nested_selection
  historical_windows_are_already_used: true
  engineering_folds:
  - inner_years:
